server {
    listen 80;
    server_name attendance.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS (Required for camera & GPS)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name attendance.yourdomain.com;

    # SSL Certificate (managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/attendance.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Max upload size for selfie images
    client_max_body_size 15M;

    # Frontend Single Page App (Static Files)
    root /var/www/logistics-attendance/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend REST API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}
